name: Delivery verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DELIVERY_TEST_ENV: ci
      PLAYWRIGHT_BASE_URL: http://localhost
      API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the shared delivery gate
        run: python scripts/verify.py full

      - name: Upload delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: |
            test/acceptance/P0-08/artifacts
            test/acceptance/P0-08/playwright-report
            test/acceptance/P0-04/backups
            test/acceptance/P0-04/drill-report.json
            test/acceptance/P0-04/logs

      - name: Upload P0-07 schema migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-migration-evidence
          if-no-files-found: warn
          retention-days: 7
          path: |
            test/acceptance/P0-07/drill-report.json
            test/acceptance/P0-07/backups/**/*.manifest.json
            test/acceptance/P0-07/backups/**/*.sha256
