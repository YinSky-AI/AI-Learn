<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}管理后台{% endblock %} - 智慧学习平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif; }
        .sidebar-link { transition: all 0.15s ease; }
        .sidebar-link:hover { background-color: rgba(255,255,255,0.08); }
        .sidebar-link.active { background-color: rgba(59,130,246,0.2); border-right: 3px solid #3b82f6; color: #60a5fa; }
        .stat-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
        .toggle-switch { position: relative; width: 44px; height: 24px; cursor: pointer; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; inset: 0; background-color: #cbd5e1; border-radius: 24px; transition: 0.3s; }
        .toggle-slider::before { content: ""; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.3s; }
        .toggle-switch input:checked + .toggle-slider { background-color: #22c55e; }
        .toggle-switch input:checked + .toggle-slider::before { transform: translateX(20px); }
        table th { white-space: nowrap; }
        .page-btn { min-width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; border: 1px solid #e2e8f0; background: white; color: #334155; cursor: pointer; transition: all 0.15s; }
        .page-btn:hover:not(.active):not(:disabled) { background-color: #f1f5f9; }
        .page-btn.active { background-color: #3b82f6; color: white; border-color: #3b82f6; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 50; }
    </style>
    {% block extra_style %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 顶部导航 -->
    <nav class="bg-gray-900 text-white h-14 flex items-center justify-between px-6 fixed top-0 left-0 right-0 z-40">
        <div class="flex items-center space-x-3">
            <svg class="w-7 h-7 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
            <span class="text-lg font-semibold">智慧学习平台</span>
            <span class="text-xs bg-blue-600 px-2 py-0.5 rounded-full ml-1">管理后台</span>
        </div>
        <div class="flex items-center space-x-4">
            <a href="/admin" class="text-gray-300 hover:text-white text-sm">仪表盘</a>
            <form method="POST" action="/admin/logout" class="inline">
                <input type="hidden" name="csrf_token" id="admin-logout-csrf">
                <button type="submit" class="text-gray-300 hover:text-red-400 text-sm flex items-center space-x-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                <span>退出</span>
                </button>
            </form>
        </div>
    </nav>

    <div class="flex pt-14">
        <!-- 侧边栏 -->
        <aside class="w-56 bg-gray-800 text-gray-200 min-h-[calc(100vh-56px)] fixed left-0 top-14 z-30">
            <div class="py-4">
                <a href="/admin" class="sidebar-link flex items-center px-5 py-3 text-sm {% if active_page == 'dashboard' %}active{% endif %}">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                    仪表盘
                </a>
                <a href="/admin/courses" class="sidebar-link flex items-center px-5 py-3 text-sm {% if active_page == 'courses' %}active{% endif %}">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                    课程管理
                </a>
                <a href="/admin/lessons" class="sidebar-link flex items-center px-5 py-3 text-sm pl-10 {% if active_page == 'lessons' %}active{% endif %}">
                    <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                    课时管理
                </a>
                <a href="/admin/questions" class="sidebar-link flex items-center px-5 py-3 text-sm {% if active_page == 'questions' %}active{% endif %}">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    题库管理
                </a>
                <a href="/admin/users" class="sidebar-link flex items-center px-5 py-3 text-sm {% if active_page == 'users' %}active{% endif %}">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0z"/></svg>
                    用户管理
                </a>
            </div>
        </aside>

        <!-- 内容区域 -->
        <main class="ml-56 flex-1 p-6 min-h-[calc(100vh-56px)]">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        (() => {
            const csrfToken = decodeURIComponent(
                (document.cookie.match(/(?:^|; )admin_csrf=([^;]*)/) || [])[1] || ''
            );
            const logoutToken = document.getElementById('admin-logout-csrf');
            if (logoutToken) logoutToken.value = csrfToken;
            const originalFetch = window.fetch.bind(window);
            window.fetch = (input, init = {}) => {
                const method = String(init.method || 'GET').toUpperCase();
                if (['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) {
                    const headers = new Headers(init.headers || {});
                    headers.set('X-CSRF-Token', csrfToken);
                    init = { ...init, headers };
                }
                return originalFetch(input, init);
            };
        })();
    </script>
    {% block extra_script %}{% endblock %}
</body>
</html>
