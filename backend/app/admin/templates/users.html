{% extends "base.html" %}
{% block title %}用户管理{% endblock %}

{% block content %}
<div class="space-y-5">
    <h1 class="text-2xl font-bold text-gray-800">用户管理</h1>

    <!-- 搜索筛选 -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
        <div class="flex flex-wrap gap-3 items-end">
            <div class="flex-1 min-w-[180px]">
                <label class="block text-xs text-gray-500 mb-1">关键词</label>
                <input type="text" id="searchKeyword" placeholder="搜索昵称/邮箱..."
                    class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">
            </div>
            <div class="min-w-[120px]">
                <label class="block text-xs text-gray-500 mb-1">年龄段</label>
                <select id="searchAgeGroup" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">
                    <option value="">全部</option>
                    <option value="6-8">6-8岁</option>
                    <option value="9-12">9-12岁</option>
                    <option value="13-15">13-15岁</option>
                    <option value="16-18">16-18岁</option>
                </select>
            </div>
            <div class="flex gap-2">
                <button onclick="loadData(1)" class="px-4 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700 transition">搜索</button>
                <button onclick="resetSearch()" class="px-4 py-2 bg-gray-100 text-gray-600 text-sm rounded-lg hover:bg-gray-200 transition">重置</button>
            </div>
        </div>
    </div>

    <!-- 数据表格 -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-gray-50 border-b border-gray-100">
                    <tr>
                        <th class="text-left px-4 py-3 text-gray-500 font-medium">ID</th>
                        <th class="text-left px-4 py-3 text-gray-500 font-medium">昵称</th>
                        <th class="text-left px-4 py-3 text-gray-500 font-medium">邮箱</th>
                        <th class="text-left px-4 py-3 text-gray-500 font-medium">年龄段</th>
                        <th class="text-right px-4 py-3 text-gray-500 font-medium">积分</th>
                        <th class="text-right px-4 py-3 text-gray-500 font-medium">连续天数</th>
                        <th class="text-left px-4 py-3 text-gray-500 font-medium">报名时间</th>
                        <th class="text-left px-4 py-3 text-gray-500 font-medium">上次登录</th>
                        <th class="text-center px-4 py-3 text-gray-500 font-medium">操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="9" class="px-4 py-10 text-center text-gray-400">加载中...</td></tr>
                </tbody>
            </table>
        </div>
        <!-- 分页 -->
        <div class="flex items-center justify-between px-4 py-3 border-t border-gray-100">
            <span id="pageInfo" class="text-sm text-gray-500"></span>
            <div id="pagination" class="flex gap-1"></div>
        </div>
    </div>
</div>

<!-- 编辑弹窗 -->
<div id="editModal" class="modal-overlay" style="display:none;">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md mx-4">
        <div class="px-5 py-4 border-b border-gray-100 flex justify-between items-center">
            <h3 class="font-semibold text-gray-800">编辑用户</h3>
            <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="p-5 space-y-4">
            <input type="hidden" id="editUserId">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">昵称</label>
                <input type="text" id="editNickname" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">年龄段</label>
                <select id="editAgeGroup" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">
                    <option value="">未设置</option>
                    <option value="6-8">6-8岁</option>
                    <option value="9-12">9-12岁</option>
                    <option value="13-15">13-15岁</option>
                    <option value="16-18">16-18岁</option>
                </select>
            </div>
        </div>
        <div class="px-5 py-4 border-t border-gray-100 flex justify-end gap-2">
            <button onclick="closeEditModal()" class="px-4 py-2 bg-gray-100 text-gray-600 text-sm rounded-lg hover:bg-gray-200 transition">取消</button>
            <button onclick="saveUser()" class="px-4 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700 transition">保存</button>
        </div>
    </div>
</div>

<script>
let currentPage = 1;
const pageSize = 15;
const AGE_GROUP_MAP = {'6-8':'6-8岁','9-12':'9-12岁','10-12':'10-12岁','13-15':'13-15岁','16-18':'16-18岁','AGE_6_8':'6-8岁','AGE_9_12':'9-12岁','AGE_10_12':'10-12岁','AGE_13_15':'13-15岁','AGE_16_18':'16-18岁'};
function ageGroupMap(v) { return AGE_GROUP_MAP[v] || v || '-'; }

function shortId(id) {
    return id ? id.substring(0, 8) : '-';
}

function formatTime(t) {
    if (!t) return '-';
    return new Date(t).toLocaleString('zh-CN');
}

function getParams(page) {
    const p = new URLSearchParams();
    p.set('page', page);
    p.set('page_size', pageSize);
    const keyword = document.getElementById('searchKeyword').value.trim();
    const ageGroup = document.getElementById('searchAgeGroup').value;
    if (keyword) p.set('keyword', keyword);
    if (ageGroup) p.set('age_group', ageGroup);
    return p;
}

async function loadData(page) {
    currentPage = page;
    const params = getParams(page);
    const resp = await fetch('/admin/users/api/list?' + params.toString());
    const data = await resp.json();
    renderTable(data.items || []);
    renderPagination(data.total || 0, page, data.page_size || pageSize);
}

function renderTable(items) {
    const tbody = document.getElementById('tableBody');
    if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="9" class="px-4 py-10 text-center text-gray-400">暂无数据</td></tr>';
        return;
    }
    tbody.innerHTML = items.map(u => `
        <tr class="border-t border-gray-50 hover:bg-gray-50">
            <td class="px-4 py-3 text-gray-400 text-xs font-mono" title="${u.id}">${shortId(u.id)}</td>
            <td class="px-4 py-3 text-gray-800 font-medium">${u.nickname || '-'}</td>
            <td class="px-4 py-3 text-gray-500">${u.email || '-'}</td>
            <td class="px-4 py-3 text-gray-600">${ageGroupMap(u.age_group) || '-'}</td>
            <td class="px-4 py-3 text-right font-semibold text-gray-700">${u.total_score ?? 0}</td>
            <td class="px-4 py-3 text-right text-gray-600">${u.streak_days ?? 0}</td>
            <td class="px-4 py-3 text-gray-400 text-xs whitespace-nowrap">${formatTime(u.created_at)}</td>
            <td class="px-4 py-3 text-gray-400 text-xs whitespace-nowrap">${formatTime(u.last_login_date)}</td>
            <td class="px-4 py-3 text-center space-x-2">
                <button onclick="openEditModal('${u.id}', '${(u.nickname || '').replace(/'/g, "\\'")}', '${u.age_group || ''}')"
                    class="text-blue-500 hover:text-blue-700 text-xs transition">编辑</button>
                <button onclick="deleteUser('${u.id}', '${(u.nickname || '').replace(/'/g, "\\'")}')"
                    class="text-red-400 hover:text-red-600 text-xs transition">删除</button>
            </td>
        </tr>
    `).join('');
}

function renderPagination(total, page, size) {
    const totalPages = Math.max(1, Math.ceil(total / size));
    document.getElementById('pageInfo').textContent = `共 ${total} 条，第 ${page}/${totalPages} 页`;
    const container = document.getElementById('pagination');
    let html = '';
    html += `<button class="page-btn" ${page <= 1 ? 'disabled' : ''} onclick="loadData(${page - 1})">&laquo;</button>`;

    let start = Math.max(1, page - 2);
    let end = Math.min(totalPages, page + 2);
    if (start > 1) { html += `<button class="page-btn" onclick="loadData(1)">1</button>`; if (start > 2) html += `<span class="px-1 text-gray-400">...</span>`; }
    for (let i = start; i <= end; i++) {
        html += `<button class="page-btn ${i === page ? 'active' : ''}" onclick="loadData(${i})">${i}</button>`;
    }
    if (end < totalPages) { if (end < totalPages - 1) html += `<span class="px-1 text-gray-400">...</span>`; html += `<button class="page-btn" onclick="loadData(${totalPages})">${totalPages}</button>`; }

    html += `<button class="page-btn" ${page >= totalPages ? 'disabled' : ''} onclick="loadData(${page + 1})">&raquo;</button>`;
    container.innerHTML = html;
}

function openEditModal(id, nickname, ageGroup) {
    document.getElementById('editUserId').value = id;
    document.getElementById('editNickname').value = nickname;
    document.getElementById('editAgeGroup').value = ageGroup;
    document.getElementById('editModal').style.display = 'flex';
}

function closeEditModal() {
    document.getElementById('editModal').style.display = 'none';
}

async function saveUser() {
    const id = document.getElementById('editUserId').value;
    const nickname = document.getElementById('editNickname').value.trim();
    const ageGroup = document.getElementById('editAgeGroup').value;
    try {
        const resp = await fetch(`/admin/users/api/${id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({nickname: nickname, age_group: ageGroup})
        });
        const data = await resp.json();
        if (resp.ok) { closeEditModal(); loadData(currentPage); }
        else { alert(data.message || '保存失败'); }
    } catch (e) { alert('请求失败'); }
}

function deleteUser(id, nickname) {
    if (!confirm(`确定停用用户「${nickname}」吗？学习记录会保留，之后可以恢复。`)) return;
    const reason = prompt('请输入停用原因（至少 5 个字）');
    if (!reason) return;
    fetch(`/admin/users/api/${id}`, { method: 'DELETE', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({reason}) })
        .then(r => readAdminResponse(r))
        .then(data => {
            if (data.success) { loadData(currentPage); }
            else { alert(data.message || '删除失败'); }
        })
        .catch(() => alert('请求失败'));
}

function resetSearch() {
    document.getElementById('searchKeyword').value = '';
    document.getElementById('searchAgeGroup').value = '';
    loadData(1);
}

document.getElementById('searchKeyword').addEventListener('keydown', e => { if (e.key === 'Enter') loadData(1); });

loadData(1);
</script>
{% endblock %}
