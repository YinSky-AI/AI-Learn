# =============================================================================
# AI 智能学习平台 Docker Compose 编排文件
# AI-Learn-v0.1
# =============================================================================

name: ai-learn

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 - 主数据库
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ai-learn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learning_platform
      POSTGRES_INITDB_ARGS: "-E UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 注意：若 init-db.sql 不存在，首次启动时 Docker 会报文件不存在警告，请确保文件已创建
    networks:
      - ai-learn-net

  # 无持久卷、无宿主机端口，仅用于交付验证和迁移演练。
  postgres-test:
    image: postgres:16-alpine
    profiles: ["delivery-test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learning_platform_test
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning_platform_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - ai-learn-net

  # ---------------------------------------------------------------------------
  # Redis 7 - 缓存 & 会话存储
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ai-learn-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ai-learn-net

  # ---------------------------------------------------------------------------
  # Backend - FastAPI 后端服务
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-learn-backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/learning_platform
      AI_LEARN_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_learn
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ai-learn-net

  # ---------------------------------------------------------------------------
  # Frontend - Next.js 前端服务
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://backend:8000
    container_name: ai-learn-frontend
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ai-learn-net

  # ---------------------------------------------------------------------------
  # Nginx 统一网关
  # ---------------------------------------------------------------------------
  nginx-gateway:
    image: nginx:alpine
    container_name: ai-learn-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health | grep -q 'nginx ok'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ai-learn-net



# =============================================================================
# 持久化卷
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# =============================================================================
# 自定义桥接网络
# =============================================================================
networks:
  ai-learn-net:
    driver: bridge
