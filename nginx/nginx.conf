# =============================================================================
# AI 智能学习平台 - Nginx 配置
# 反向代理 + SSE + WebSocket + Gzip + 安全头
# =============================================================================

# 工作进程数
worker_processes auto;

# 错误日志
error_log /var/log/nginx/error.log warn;
pid       /tmp/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- 日志格式 ----
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # ---- 基础性能优化 ----
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_max_body_size 20m;

    # ---- Gzip 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ---- 上游服务定义 ----
    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # ---- HTTP -> HTTPS 重定向（生产环境取消注释） ----
    # server {
    #     listen 80;
    #     server_name your-domain.com;
    #     return 301 https://$host$request_uri;
    # }

    # ---- HTTPS 服务器（生产环境 SSL 配置） ----
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #     ssl_session_tickets off;
    #
    #     include /etc/nginx/conf.d/security-headers.conf;
    #     include /etc/nginx/conf.d/proxy-rules.conf;
    # }

    # ---- 主服务器（HTTP，开发/测试环境） ----
    server {
        listen 80;
        server_name _;

        # ---- 安全头 ----
        # 内容安全策略
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' ws: wss: https:; frame-ancestors 'self'; base-uri 'self';" always;

        # 防止点击劫持
        add_header X-Frame-Options "SAMEORIGIN" always;

        # 防止 MIME 类型嗅探
        add_header X-Content-Type-Options "nosniff" always;

        # XSS 保护
        add_header X-XSS-Protection "1; mode=block" always;

        # 引用来源策略
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 权限策略
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # HSTS（生产环境启用 HTTPS 后打开）
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ============ 管理后台（FastAPI 后端渲染） ============
        location /admin {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- API 代理 -> Backend ----
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # 传递客户端信息
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header X-Request-ID       $request_id;

            # 连接复用
            proxy_set_header Connection "";

            # 超时设置
            proxy_connect_timeout 10s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;

            # 缓冲设置
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # ---- SSE 代理（AI 流式对话，关闭缓冲） ----
        location /api/v1/ai/stream {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header Connection          "";
            proxy_set_header Accept             "text/event-stream";
            proxy_set_header Cache-Control      "no-cache";
            proxy_set_header X-Accel-Buffering  "no";

            # 关闭缓冲 - SSE 关键配置
            proxy_buffering    off;
            proxy_cache        off;
            chunked_transfer_encoding on;

            # 长连接超时
            proxy_connect_timeout 10s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;
        }

        # ---- WebSocket 代理 ----
        location /api/v1/ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # WebSocket 必需头
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;

            # 关闭缓冲
            proxy_buffering off;

            # WebSocket 超时（保持长连接）
            proxy_connect_timeout 10s;
            proxy_send_timeout    3600s;
            proxy_read_timeout    3600s;
        }

        # ---- 健康检查（Nginx 层） ----
        location /health {
            access_log off;
            return 200 '{"status":"nginx ok"}';
            add_header Content-Type application/json;
        }

        # ---- 前端代理 -> Next.js ----
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $http_connection;

            # 缓冲
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;
        }

        # ---- Next.js 静态资源缓存 ----
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 长期缓存：Next.js 静态资源带 hash 指纹
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ---- Next.js 图片优化缓存 ----
        location /_next/image {
            proxy_pass http://frontend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 图片缓存 30 天
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
            access_log off;
        }

        # ---- Favicon / robots.txt 等静态文件 ----
        location = /favicon.ico {
            proxy_pass http://frontend;
            access_log off;
            expires 7d;
            add_header Cache-Control "public";
        }

        location = /robots.txt {
            proxy_pass http://frontend;
            access_log off;
            expires 1d;
            add_header Cache-Control "public";
        }

        # ---- 禁止访问隐藏文件 ----
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
