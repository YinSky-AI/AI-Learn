server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 处理 /admin/assets/ 静态资源 - 去掉 /admin 前缀
    location ^~ /admin/assets/ {
        rewrite ^/admin/(.*)$ /$1 break;
        try_files $uri =404;
    }

    # 处理 /admin 下其他静态文件（favicon.ico 等）
    location ^~ /admin/ {
        rewrite ^/admin/(.*)$ /$1 break;
        try_files $uri /index.html;
    }

    # SPA 回退 - /admin 路由统一返回 index.html
    location = /admin {
        try_files /index.html =404;
    }

    # 默认路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
